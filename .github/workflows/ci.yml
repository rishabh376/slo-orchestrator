name: ci
on:
  push: { branches: [] }
  pull_request: { branches: [] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go test ./... || true
      - run: go build -v ./...
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: '.' }
